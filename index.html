<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | Product preview card component</title>
    <link rel="icon" href="favicon-32x32.png">
    <link rel="stylesheet" href="product.css">
</head>
<body>
   <main class="container">
      <div class="images">
       <img src="image-product-desktop.jpg" alt="product" class="desktop">
      <img src="image-product-mobile.jpg" alt="product" class="mobile">
      </div>
     <div class="details">
        <div class="product-category">PERFUME</div>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
      Perfumer-Creator for the House of CHANEL.</p>
     <div class="price">
        <span class="new-price">$149.99</span><s class="old-price">$169.99</s>
     </div>
     <button><img src="icon-cart.svg" class="cart"> Add to cart</button>
        </div>
   </main>
   <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Gabriel Oluwaseun</a>.
  </footer>

  
</body>
</html>
